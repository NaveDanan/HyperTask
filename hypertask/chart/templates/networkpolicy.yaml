{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hypertask.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hypertask.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hypertask.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "hypertask.selector" . | nindent 14 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hypertask.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hypertask.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hypertask.selector" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  {{- toYaml .Values.networkPolicy.ingressControllerNamespaces | nindent 18 }}
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
