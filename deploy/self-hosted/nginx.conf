events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  resolver 127.0.0.11 valid=10s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 80;
    client_max_body_size 2G;
    underscores_in_headers on;
    set $cloud http://appflowy_cloud:8000;
    set $auth http://gotrue:9999;
    set $admin http://admin_frontend:3000;
    set $web http://web:80;
    set $storage http://minio:9000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass_request_headers on;
    location = /healthz { access_log off; return 200 'AppFlowy DEMO proxy ready\n'; }
    location = /health { proxy_pass $cloud; }
    location = /verify { access_log off; proxy_pass $auth; }
    location /gotrue/ {
      access_log off;
      rewrite ^/gotrue(/.*)$ $1 break;
      proxy_pass $auth;
    }
    location /ws {
      access_log off;
      proxy_pass $cloud;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
    }
    location /api {
      access_log off;
      proxy_pass $cloud;
      proxy_set_header X-Request-Id $request_id;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 600s;
    }
    location /minio-api/ {
      rewrite ^/minio-api/(.*) /$1 break;
      proxy_pass $storage;
      proxy_set_header Host minio:9000;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_request_buffering off;
    }
    location /console { proxy_pass $admin; }
    location = / {
      default_type text/html;
      return 200 '<!doctype html><title>AppFlowy DEMO</title><h1>AppFlowy DEMO</h1><p>Your collaboration server is local to collaboration.example.com.</p><p><a href="/console">Sign in to the local console</a></p><p>Use this origin in the Windows app Storage &amp; server settings.</p><p><a href="/app">Web workspace</a> is available after the web build finishes.</p>';
    }
    location / {
      add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://$http_host wss://$http_host blob:; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; frame-src 'self';" always;
      proxy_pass $web;
    }
  }
}