[package]
name = "electron-core"
version = "0.1.0"
edition = "2021"

# Hosts the Rust core in a child process of the Electron shell.
[[bin]]
name = "appflowy_core"
path = "src/main.rs"

[dependencies]
bytes.workspace = true
tokio = { workspace = true, features = ["full", "rt-multi-thread", "tracing"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9.27"
semver = "1.0.22"
tracing.workspace = true
futures = "0.3.31"

# workspace
lib-dispatch = { workspace = true, features = ["local_set"] }
lib-log.workspace = true
lib-infra.workspace = true
flowy-core = { workspace = true }
flowy-notification.workspace = true
flowy-document.workspace = true
flowy-user.workspace = true
flowy-date.workspace = true
flowy-server = { workspace = true }
flowy-server-pub = { workspace = true }
collab-integrate = { workspace = true }
flowy-error = { workspace = true, features = ["impl_from_sqlite", "impl_from_dispatch_error", "impl_from_appflowy_cloud", "impl_from_reqwest", "impl_from_serde"] }

[features]
file_reader = ["flowy-core/file_reader"]
http_sync = ["flowy-core/http_sync"]
verbose_log = []
openssl_vendored = ["flowy-core/openssl_vendored"]
