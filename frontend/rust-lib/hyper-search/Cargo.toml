[package]
name = "hyper-search"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
collab = { workspace = true }
collab-folder = { workspace = true }

hyper-derive.workspace = true
hyper-error = { workspace = true, features = [
  "impl_from_sqlite",
  "impl_from_dispatch_error",
  "impl_from_collab_document",
  "impl_from_tantivy",
  "impl_from_serde",
] }
hyper-user.workspace = true
hyper-search-pub.workspace = true
hyper-folder = { workspace = true }
bytes.workspace = true
lib-dispatch.workspace = true
lib-infra = { workspace = true }
protobuf.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "rt-multi-thread", "tracing"] }
tracing.workspace = true
derive_builder.workspace = true
strum_macros = "0.26.1"
tantivy.workspace = true
uuid.workspace = true
futures.workspace = true
tokio-stream.workspace = true
async-stream = "0.3.6"
dashmap.workspace = true
arc-swap.workspace = true

[build-dependencies]
hyper-codegen.workspace = true

[features]
