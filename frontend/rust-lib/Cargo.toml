[workspace]
members = [
  "lib-dispatch",
  "lib-log",
  "hyper-core",
  "electron-core",
  "hyper-user",
  "hyper-user-pub",
  "event-integration-test",
  "hyper-sqlite",
  "hyper-folder",
  "hyper-folder-pub",
  "hyper-notification",
  "hyper-document",
  "hyper-document-pub",
  "hyper-error",
  "hyper-database2",
  "hyper-database-pub",
  "hyper-server",
  "hyper-server-pub",
  "hyper-storage",
  "collab-integrate",
  "hyper-date",
  "hyper-search",
  "lib-infra",
  "build-tool/hyper-ast",
  "build-tool/hyper-codegen",
  "build-tool/hyper-derive",
  "hyper-search-pub",
  "hyper-ai",
  "hyper-ai-pub",
  "hyper-storage-pub",
  "hyper-sqlite-vec",
]

resolver = "2"

[workspace.dependencies]
lib-dispatch = { path = "lib-dispatch" }
lib-log = { path = "lib-log" }
lib-infra = { path = "lib-infra" }
hyper-ast = { path = "build-tool/hyper-ast" }
hyper-codegen = { path = "build-tool/hyper-codegen", features = ["proto_gen"] }
hyper-derive = { path = "build-tool/hyper-derive" }
hyper-core = { path = "hyper-core" }
hyper-user = { path = "hyper-user" }
hyper-user-pub = { path = "hyper-user-pub" }
hyper-sqlite = { path = "hyper-sqlite" }
hyper-folder = { path = "hyper-folder" }
hyper-folder-pub = { path = "hyper-folder-pub" }
hyper-notification = { path = "hyper-notification" }
hyper-document = { path = "hyper-document" }
hyper-document-pub = { path = "hyper-document-pub" }
hyper-error = { path = "hyper-error" }
hyper-database2 = { path = "hyper-database2" }
hyper-database-pub = { path = "hyper-database-pub" }
hyper-server = { path = "hyper-server" }
hyper-server-pub = { path = "hyper-server-pub" }
hyper-storage = { path = "hyper-storage" }
hyper-storage-pub = { path = "hyper-storage-pub" }
hyper-search = { path = "hyper-search" }
hyper-search-pub = { path = "hyper-search-pub" }
collab-integrate = { path = "collab-integrate" }
hyper-date = { path = "hyper-date" }
hyper-ai = { path = "hyper-ai" }
hyper-ai-pub = { path = "hyper-ai-pub" }
anyhow = "1.0"
arc-swap = "1.7"
tracing = "0.1.40"
bytes = "1.5.0"
serde_json = "1.0.108"
serde = "1.0.194"
protobuf = { version = "2.28.0" }
diesel = { version = "2.1.0", features = [
  "sqlite",
  "chrono",
  "r2d2",
  "serde_json",
] }
diesel_derives = { version = "2.1.0", features = ["sqlite", "r2d2"] }
uuid = { version = "1.5.0", features = ["serde", "v4", "v5"] }
serde_repr = "0.1"
futures = "0.3.31"
tokio = "1.38.0"
tokio-stream = "0.1.17"
ollama-rs = { version = "0.3.0" }
async-trait = "0.1.81"
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
collab = { version = "0.2" }
collab-entity = { version = "0.2" }
collab-folder = { version = "0.2" }
collab-document = { version = "0.2" }
collab-database = { version = "0.2" }
collab-plugins = { version = "0.2" }
collab-user = { version = "0.2" }
collab-importer = { version = "0.1" }
yrs = "0.21.0"
validator = { version = "0.18", features = ["derive"] }
tokio-util = "0.7.11"
zip = "2.2.0"
dashmap = "6.0.1"
derive_builder = "0.20.2"
tantivy = { version = "0.24.1" }
num_enum = "0.7.3"
hyper-sqlite-vec = { path = "hyper-sqlite-vec" }

# Please using the following command to update the revision id
# Current directory: frontend
# Run the script.add_workspace_members:
# scripts/tool/update_client_api_rev.sh  new_rev_id
# ⚠️⚠️⚠️️
client-api = { git = "https://github.com/AppFlowy-IO/AppFlowy-Cloud", rev = "592f644" }
client-api-entity = { git = "https://github.com/AppFlowy-IO/AppFlowy-Cloud", rev = "592f644" }
workspace-template = { git = "https://github.com/AppFlowy-IO/AppFlowy-Cloud", rev = "592f644" }

[profile.dev]
opt-level = 0
lto = false
codegen-units = 16
debug = true

[profile.release]
lto = true
opt-level = 3
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true
codegen-units = 16
lto = false

#strip = "debuginfo"
incremental = true

[patch.crates-io]
# We're using a specific commit here because rust-rocksdb doesn't publish the latest version that includes the memory alignment fix.
# For more details, see https://github.com/rust-rocksdb/rust-rocksdb/pull/868
rocksdb = { git = "https://github.com/rust-rocksdb/rust-rocksdb", rev = "1710120e4549e04ba3baa6a1ee5a5a801fa45a72" }
# Please use the following script to update collab.
# Working directory: frontend
#
# To update the commit ID, run:
# scripts/tool/update_collab_rev.sh new_rev_id
#
# To switch to the local path, run:
# scripts/tool/update_collab_source.sh
# ⚠️⚠️⚠️️
collab = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-entity = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-folder = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-document = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-database = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-plugins = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-user = { version = "0.2", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }
collab-importer = { version = "0.1", git = "https://github.com/AppFlowy-IO/AppFlowy-Collab", rev = "4dfccef" }

langchain-rust = { version = "4.6.0", git = "https://github.com/appflowy/langchain-rust", branch = "af" }
