[package]
name = "hyper-core"
version = "0.1.0"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lib-dispatch = { workspace = true }
lib-log = { workspace = true }
hyper-user = { workspace = true }
hyper-user-pub = { workspace = true }
hyper-folder = { workspace = true }
hyper-folder-pub = { workspace = true }
hyper-database2 = { workspace = true }
hyper-database-pub = { workspace = true }
hyper-sqlite = { workspace = true }
hyper-document = { workspace = true }
hyper-document-pub = { workspace = true }
hyper-error = { workspace = true }
hyper-server = { workspace = true }
hyper-server-pub = { workspace = true }
hyper-date = { workspace = true }
collab-integrate = { workspace = true }
hyper-search = { workspace = true }
hyper-search-pub = { workspace = true }
collab-entity = { workspace = true }
collab-plugins = { workspace = true }
collab-folder = { workspace = true }
collab-document = { workspace = true }

collab = { workspace = true }
#collab = { workspace = true, features = ["verbose_log"] }

diesel.workspace = true
hyper-storage = { workspace = true }
hyper-storage-pub = { workspace = true }
client-api.workspace = true
hyper-ai = { workspace = true }
hyper-ai-pub = { workspace = true }


tracing.workspace = true
futures-core = { version = "0.3", default-features = false }
futures = "0.3"
bytes.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true, features = ["sync"] }
console-subscriber = { version = "0.2", optional = true }
anyhow.workspace = true
dashmap.workspace = true
arc-swap.workspace = true
base64 = "0.21.5"
tokio-util.workspace = true
lib-infra = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
sysinfo = "0.30.5"
semver = { version = "1.0.22", features = ["serde"] }
url = "2.5.0"
once_cell = "1.19.0"


[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "windows"))'.dependencies]
hyper-sqlite-vec = { workspace = true }
twox-hash = { version = "2.1.0", features = ["xxhash64"] }

[features]
file_reader = ["hyper-ai/file_reader"]
profiling = ["console-subscriber", "tokio/tracing"]
http_sync = []
native_sync = []
openssl_vendored = ["hyper-sqlite/openssl_vendored"]

# Enable/Disable Hypertask Verbose Log Configuration
verbose_log = [
  "hyper-document/verbose_log",
  "hyper-database2/verbose_log",
  "client-api/sync_verbose_log",
]
